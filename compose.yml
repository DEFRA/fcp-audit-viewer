services:
  fcp-audit-viewer:
    build:
      context: .
      target: development
    depends_on:
      floci-init:
        condition: service_completed_successfully
    volumes:
      - ./src:/home/node/src
      - ./package.json:/home/node/package.json
    environment:
      AUDIT_ENDPOINT: ${AUDIT_ENDPOINT:-http://fcp-audit:3004}
      ENTRA_WELL_KNOWN_URL: https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0/.well-known/openid-configuration
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET}
      ENTRA_REDIRECT_URL: http://localhost:3006/auth/sign-in-oidc
      ENTRA_SIGN_OUT_REDIRECT_URL: http://localhost:3006/auth/sign-out-oidc
      REDIS_HOST: redis
      COOKIE_PASSWORD: this-is-a-secret-that-must-be-at-least-32-characters
      AUDIT_INTERNAL_PUBLISH_SNS_TOPIC_ARN: arn:aws:sns:eu-west-2:000000000000:fcp_audit_viewer_publisher_stub
      AWS_ENDPOINT_URL: http://fcp-audit-viewer-floci:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test

  redis:
    image: redis

  floci:
    image: hectorvent/floci:latest
    # unique alias avoids colliding with the sibling fcp-audit project's own "floci" service
    # on the shared external "fcp-audit" network
    networks:
      default:
        aliases:
          - fcp-audit-viewer-floci
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_DEFAULT_REGION: eu-west-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test

  floci-init:
    image: amazon/aws-cli
    entrypoint: /bin/sh
    command: /setup/init.sh
    depends_on:
      floci:
        condition: service_started
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_REGION: eu-west-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - ./floci/init.sh:/setup/init.sh
